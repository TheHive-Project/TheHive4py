name: opencode

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'category:agent-ready') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verify commenter has write access
        id: permission
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              core.info(`${context.payload.comment.user.login} has '${data.permission}' permission`);
              return ['admin', 'maintain', 'write'].includes(data.permission) ? 'true' : 'false';
            } catch (error) {
              core.warning(`Could not determine permissions: ${error.message}`);
              return 'false';
            }

      - name: Checkout repository
        if: steps.permission.outputs.result == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git identity
        if: steps.permission.outputs.result == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        if: steps.permission.outputs.result == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dev dependencies
        if: steps.permission.outputs.result == 'true'
        run: pip install --no-cache-dir -U pip -e '.[dev]'

      - name: Run OpenCode
        if: steps.permission.outputs.result == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
